name: Build Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'dist/trianon.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Prepare preview application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import textwrap

          root = Path('android-preview')
          def write(path, content):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding='utf-8')

          write('settings.gradle', '''
              pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
              dependencyResolutionManagement { repositories { google(); mavenCentral() } }
              rootProject.name = 'TrianonPreview'
              include ':app'
          ''')
          write('build.gradle', '''
              plugins { id 'com.android.application' version '8.9.1' apply false }
          ''')
          write('app/build.gradle', '''
              plugins { id 'com.android.application' }
              android {
                  namespace 'app.ghiky166.trianon.preview'
                  compileSdk 35
                  defaultConfig {
                      applicationId 'app.ghiky166.trianon.preview'
                      minSdk 26
                      targetSdk 35
                      versionCode 7
                      versionName '0.7-preview'
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
          ''')
          write('app/src/main/AndroidManifest.xml', '''
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <application android:label="Trianon 预览" android:allowBackup="false" android:enableOnBackInvokedCallback="false"
                      android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar"
                      android:supportsRtl="true" android:usesCleartextTraffic="false">
                      <activity android:name=".MainActivity" android:exported="true"
                          android:windowSoftInputMode="adjustResize">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          ''')
          write('app/src/main/res/drawable/ic_trianon_background.xml', '''
              <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
                  <solid android:color="#B9CADE" />
              </shape>
          ''')
          write('app/src/main/res/drawable/ic_trianon_foreground.xml', '''
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#8FA8C5" android:pathData="M28,39 L80,39 Q84,39 84,43 L84,72 Q84,77 79,77 L29,77 Q24,77 24,72 L24,43 Q24,39 28,39 Z" />
                  <path android:fillColor="#FCF8EE" android:strokeColor="#738BA9" android:strokeWidth="1.2"
                      android:pathData="M28,35 L80,35 Q83,35 83,39 L83,69 Q83,73 79,73 L29,73 Q25,73 25,69 L25,39 Q25,35 28,35 Z" />
                  <path android:fillColor="#F1ECDF" android:strokeColor="#A4B3C5" android:strokeWidth="0.8"
                      android:pathData="M26,71 L47,52 Q54,47 61,52 L82,71 Z" />
                  <path android:fillColor="#FFFCF5" android:strokeColor="#738BA9" android:strokeWidth="1.2"
                      android:pathData="M26,37 L50,56 Q54,59 58,56 L82,37" />
                  <path android:fillColor="#6982A8" android:strokeColor="#E1E7EF" android:strokeWidth="1"
                      android:pathData="M64,61 A10,10 0,1 1,44 61 A10,10 0,1 1,64 61 Z" />
                  <path android:fillColor="#FFF8E7" android:pathData="M48,55 L60,55 L60,58 L59,58 L58,56.5 L55,56.5 L55,66 L57,66 L57,67 L51,67 L51,66 L53,66 L53,56.5 L50,56.5 L49,58 L48,58 Z" />
              </vector>
          ''')
          for icon_name in ('ic_launcher', 'ic_launcher_round'):
              write(f'app/src/main/res/mipmap-anydpi-v26/{icon_name}.xml', '''
                  <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                      <background android:drawable="@drawable/ic_trianon_background" />
                      <foreground android:drawable="@drawable/ic_trianon_foreground" />
                  </adaptive-icon>
              ''')
          write('app/src/main/java/app/ghiky166/trianon/preview/MainActivity.java', '''
              package app.ghiky166.trianon.preview;
              import android.app.Activity;
              import android.os.Bundle;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;
              import android.webkit.WebResourceRequest;
              import android.content.Intent;
              import android.net.Uri;

              public class MainActivity extends Activity {
                  private WebView web;
                  @Override public void onCreate(Bundle state) {
                      super.onCreate(state);
                      web = new WebView(this);
                      web.getSettings().setJavaScriptEnabled(true);
                      web.getSettings().setDomStorageEnabled(true);
                      web.getSettings().setAllowFileAccess(true);
                      web.getSettings().setAllowContentAccess(false);
                      web.getSettings().setAllowFileAccessFromFileURLs(false);
                      web.getSettings().setAllowUniversalAccessFromFileURLs(false);
                      web.getSettings().setBlockNetworkLoads(true);
                      web.getSettings().setMixedContentMode(android.webkit.WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                      android.webkit.CookieManager.getInstance().setAcceptThirdPartyCookies(web, false);
                      web.getSettings().setUseWideViewPort(true);
                      web.setInitialScale(100);
                      web.getSettings().setLoadWithOverviewMode(false);
                      web.getSettings().setBuiltInZoomControls(false);
                      web.getSettings().setSupportZoom(false);
                      web.getSettings().setDisplayZoomControls(false);
                      web.setWebViewClient(new WebViewClient() {
                          @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                              String url = r.getUrl().toString();
                              if (url.startsWith("file:///android_asset/") || url.equals("about:blank")) return false;
                              if (r.isForMainFrame() && (url.startsWith("https://") || url.startsWith("http://"))) {
                                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                                  catch (android.content.ActivityNotFoundException ignored) { }
                              }
                              return true;
                          }
                      });
                      setContentView(web);
                      web.loadUrl("file:///android_asset/trianon.html#empty");
                  }
                  @Override public void onBackPressed() {
                      if (web == null) { super.onBackPressed(); return; }
                      web.evaluateJavascript("Boolean(window.__phoneBack && window.__phoneBack())", result -> {
                          if (!"true".equals(result)) {
                              if (web.canGoBack()) web.goBack(); else finish();
                          }
                      });
                  }
                  @Override protected void onPause() {
                      if (web != null) web.onPause();
                      super.onPause();
                  }
                  @Override protected void onResume() {
                      super.onResume();
                      if (web != null) web.onResume();
                  }
                  @Override protected void onDestroy() {
                      if (web != null) { web.stopLoading(); web.destroy(); }
                      super.onDestroy();
                  }
              }
          ''')
          assets = root / 'app/src/main/assets'
          assets.mkdir(parents=True, exist_ok=True)
          source = Path('dist/trianon.html')
          if not source.is_file():
              raise SystemExit('Missing dist/trianon.html in the repository')
          import re
          from pathlib import Path
          from html.parser import HTMLParser
          import re, hashlib, base64, io, json

          class Outline(HTMLParser):
              void = set('area base br col embed hr img input link meta param source track wbr'.split())
              def __init__(self, text):
                  super().__init__(convert_charrefs=False)
                  self.text=text; self.lines=[0]; self.nodes=[]; self.stack=[]
                  self.lines.extend(m.end() for m in re.finditer('\n',text))
                  self.feed(text)
              def pos(self):
                  line,col=self.getpos(); return self.lines[line-1]+col
              def handle_starttag(self,tag,attrs):
                  n={'tag':tag,'a':dict(attrs),'start':self.pos(),'end':None,'parent':self.stack[-1] if self.stack else None}
                  self.nodes.append(n)
                  if tag in self.void: n['end']=self.pos()+len(self.get_starttag_text())
                  else: self.stack.append(n)
              def handle_startendtag(self,tag,attrs):
                  self.handle_starttag(tag,attrs)
                  if self.stack and self.stack[-1]['start']==self.pos():
                      self.stack.pop()['end']=self.pos()+len(self.get_starttag_text())
              def handle_endtag(self,tag):
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i]['tag']==tag:
                          end=self.text.find('>',self.pos())+1
                          for n in self.stack[i:]: n['end']=end
                          del self.stack[i:]; break
              def find(self, *, id=None, cls=None):
                  return next(n for n in self.nodes if (id is None or n['a'].get('id')==id) and (cls is None or cls in n['a'].get('class','').split()))
              def part(self,n): return self.text[n['start']:n['end']]

          def exactly(text, old, new):
              if text.count(old)!=1: raise ValueError('Source changed; expected one patch anchor: '+old[:100])
              return text.replace(old,new,1)

          def prepare(source, assets, css, runtime):
              source=Path(source); assets=Path(assets); assets.mkdir(parents=True,exist_ok=True)
              raw=source.read_text(encoding='utf-8')
              scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',raw,re.S|re.I)
              if len(scripts)!=24: raise ValueError('Unexpected upstream script layout')
              # Keep the static stationery, the input, and the file sheet. Remove all other demo modules.
              doc=Outline(raw)
              home=doc.part(doc.find(id='vEmpty'))
              composer=doc.part(doc.find(cls='composer'))
              composer=composer.replace('<input class="ci" id="ci" type="text" autocomplete="off" spellcheck="false" aria-label="说一句话">','<textarea class="ci" id="ci" rows="1" autocomplete="off" spellcheck="false" aria-label="消息输入框"></textarea>')
              composer=re.sub(r'<div class="hint">.*?</div>','',composer,flags=re.S)
              composer=composer.replace('K3.1 Pro','选择模型').replace('>Max<','>预览<')
              # Only these image globals are referenced by the retained file sheet.
              need=set(re.findall(r'__IMG\.(\w+)',scripts[14]))
              pairs=dict(re.findall(r'(\w+):"(data:[^"]+)"',scripts[1]))
              image_js='window.__IMG='+json.dumps({k:pairs[k] for k in need},ensure_ascii=False)+';'
              home_js=scripts[10]
              home_js=exactly(home_js,"const RM=matchMedia('(prefers-reduced-motion: reduce)');","const RM={matches:true};")
              start=home_js.index('let t0=performance.now();')
              home_js=home_js[:start]+"window.__v11restart=()=>{exitT0=null;frame(5.7)};window.__v11frame=frame;frame(5.7);})();"
              files_js=scripts[14]
              files_js=exactly(files_js,"const RMQ=matchMedia('(prefers-reduced-motion: reduce)');","const RMQ={matches:true};")
              # Drag-to-reference conflicts with touch scrolling; remove drag listeners and the follower loop.
              a=files_js.index('/* ---------------------------------------------------------------- dragging'); z=files_js.index("rowsEl.addEventListener('click'",a)
              files_js=files_js[:a]+"const pd0=null;\n"+files_js[z:]
              files_js=files_js.replace('dragStart,dragMove,dragEnd,','')
              a=files_js.index('const follow=()=>'); z=files_js.index('\n',a)
              files_js=files_js[:a]+files_js[z:]
              # The @ menu follows focus/input/resize rather than polling every frame.
              files_js=files_js.replace('updAt();','updAt();placeAt();')
              files_js=files_js.replace("trianon-workbench", "示例文件 · trianon")
              # Remove the scripted demo tours, retaining only the normal file sheet boot.
              a=files_js.index('/* ---------------------------------------------------------------- scenes') if '/* ---------------------------------------------------------------- scenes' in files_js else -1
              if a<0:
                  a=files_js.index('const boot0=()=>')
              else:
                  a=files_js.index('const boot0=()=>',a)
              api=files_js.index('const api={emit,open,close,toggle')
              boot="""const boot=()=>{loadTree(buildMock());W.branch=MOCK_GIT.branch;W.git={...MOCK_GIT.entries};S.exp=new Set(['src','src/renderer']);renderAll(false);};
          (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot);
          """
              files_js=files_js[:a]+boot+files_js[api:]
              # Remove desktop editor/system-open actions that this offline APK cannot carry out.
              for control in ('flEd','flCp','flOpenSys','flReveal'):
                  files_js=re.sub(r"\$\{tabBtn\('"+control+r"',[^\n]*?\)\}", '', files_js)
              files_js=files_js.replace('仍可 <code>@</code> 引用，交给 Kimi 用工具读取','当前仅展示示例文件信息，尚未接入真实模型')
              # Standalone module files avoid inline script hashes and allow de-duplicated image resources.
              keep_ids={'v10empty','rococoV2Empty','pageFonts','ly-fl'}
              styles=[]
              for i,m in enumerate(re.finditer(r'<style\b([^>]*)>(.*?)</style>',raw,re.S|re.I)):
                  ident=re.search(r'id=["\']([^"\']+)',m[1])
                  if i==2 or (ident and ident[1] in keep_ids): styles.append(m[2])
              all_css='\n'.join(styles)+'\n'+css
              html='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trianon 0.7</title><link rel="stylesheet" href="phone.css"></head><body class="v-empty"><div class="app"><section class="stage">'+home+'<div id="vLive" class="scroll chat vw"><div id="phoneMessages"></div></div>'+composer+'</section></div><script src="images.js"></script><script src="home.js"></script><script src="files.js"></script><script src="phone.js"></script></body></html>'
              media=assets/'media'; media.mkdir(exist_ok=True)
              stats={'sourceHtmlBytes':source.stat().st_size,'removedModules':['WebGL fog','opening film','custom cursor','terminal','browser','collection','engine status','desktop account and quota','right dossier','scripted turn engine','animation tours'],'imageReferences':0,'uniqueMedia':0,'resizedImages':0}
              cache={}
              def external(m):
                  uri=m[0]
                  if uri in cache: stats['imageReferences']+=1; return cache[uri]
                  mime,payload=uri.split(';base64,',1); data=base64.b64decode(payload)
                  ext={'data:image/png':'png','data:image/webp':'webp','data:image/jpeg':'jpg','data:font/woff2':'woff2','data:font/woff':'woff','data:application/font-woff':'woff'}.get(mime,'bin')
                  if mime.startswith('data:image/'):
                      from PIL import Image
                      try:
                          im=Image.open(io.BytesIO(data))
                          if max(im.size)>1200:
                              im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
                              buf=io.BytesIO(); im.save(buf,format='WEBP',quality=90,method=4); data=buf.getvalue(); ext='webp'; stats['resizedImages']+=1
                      except (OSError,ValueError): pass
                  path='media/'+hashlib.sha256(data).hexdigest()[:24]+'.'+ext
                  (assets/path).write_bytes(data); cache[uri]=path; stats['imageReferences']+=1
                  return path
              files={'trianon.html':html,'phone.css':all_css,'images.js':image_js,'home.js':home_js,'files.js':files_js,'phone.js':runtime}
              for name,text in files.items():
                  text=re.sub(r'data:[\w/+.-]+;base64,[A-Za-z0-9+/=]+',external,text)
                  (assets/name).write_text(text,encoding='utf-8')
              stats['uniqueMedia']=len(list(media.iterdir()))
              stats['preparedAssetBytes']=sum(p.stat().st_size for p in assets.rglob('*') if p.is_file())
              stats['preparedHtmlBytes']=(assets/'trianon.html').stat().st_size
              # Local-only offline preview. No remote script, frames, or model connection is permitted.
              policy="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; img-src file: data: blob:; font-src file: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
              text=(assets/'trianon.html').read_text()
              text=text.replace('<head>','<head><meta http-equiv="Content-Security-Policy" content="'+policy+'">',1)
              (assets/'trianon.html').write_text(text,encoding='utf-8')
              (assets/'build-info.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps(stats,ensure_ascii=False))
              return stats
          prepare(source, assets, '/* 0.7: static stationery, native scrolling, event-driven sheets. */\n:root{--phone-font:11.5px;--page:#e3e9f1;--sheet:#faf9f4;--card:#f2f5fa;--text:#263655;--muted:#526583;--line:#98abc6;--accent:#526b96;--field:#f6f7fc;color-scheme:light}\nbody[data-phone-theme=dark]{--page:#1e2a40;--sheet:#2b3b54;--card:#31435f;--text:#edf2fa;--muted:#c4d0e2;--line:#859bbd;--accent:#acc5ed;--field:#2d3e59;color-scheme:dark}\n*,*::before,*::after{animation:none!important;transition:none!important;cursor:auto!important;box-sizing:border-box}\nhtml,body{width:100%!important;height:100%!important;min-width:0!important;margin:0!important;overflow:hidden!important;-webkit-text-size-adjust:100%;background:var(--page)!important;color:var(--text)!important}\nbody{font-family:var(--serif,Georgia,serif)}\nbutton,input,textarea{font:inherit}button,[role=button]{touch-action:manipulation}button{color:var(--text);background:var(--sheet);border:1px solid var(--line)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.65}\n[hidden]{display:none!important}.app{inset:0!important;width:100%!important;height:var(--phone-height,100%)!important;min-width:0!important;display:flex!important;background:var(--page)!important}\nhtml body .stage{position:relative!important;display:flex!important;flex-direction:column!important;width:100%!important;min-width:0!important;height:100%!important;margin:0!important;padding:50px 0 0!important;transform:none!important;background:var(--page)!important}\n#phoneHeader{position:fixed;z-index:120;inset:0 0 auto;height:50px;display:flex;align-items:center;gap:8px;padding:4px 9px;background:var(--sheet);border-bottom:1px solid var(--line);color:var(--text)}\n#phoneHeader>span{font:20px Georgia,serif}#phoneHeader small{margin-left:auto;font:10px sans-serif;white-space:nowrap;color:var(--muted)}#phoneHeader button{min-height:38px;min-width:38px;border-r