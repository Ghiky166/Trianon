          mobile_js = "(() => {\n  'use strict';\n  const root = document.documentElement;\n  const body = document.body;\n  const header = document.createElement('header');\n  header.id = 'phoneHeader';\n  const toggle = document.createElement('button');\n  toggle.type = 'button'; toggle.textContent = '☰';\n  toggle.setAttribute('aria-label', '打开功能菜单');\n  toggle.setAttribute('aria-expanded', 'false');\n  const title = document.createElement('span'); title.textContent = 'Trianon';\n  const badge = document.createElement('small'); badge.textContent = '离线预览 0.5';\n  const close = document.createElement('button'); close.id = 'phoneClose';\n  close.type = 'button'; close.textContent = '✕ 返回'; close.hidden = true;\n  close.setAttribute('aria-label', '关闭面板，返回聊天');\n  header.append(toggle, title, badge, close);\n  const menu = document.createElement('nav');\n  menu.id = 'phoneMenu'; menu.hidden = true; menu.setAttribute('aria-label', '功能菜单');\n  document.querySelectorAll('.rail .it').forEach((original, index) => {\n    const label = original.getAttribute('aria-label') || original.textContent.trim();\n    if (!label) return;\n    const button = document.createElement('button'); button.type = 'button';\n    button.textContent = label;\n    button.addEventListener('click', () => { closeMenu(); original.click(); });\n    menu.appendChild(button);\n  });\n  function closeMenu() { menu.hidden = true; toggle.setAttribute('aria-expanded', 'false'); }\n  toggle.addEventListener('click', () => { menu.hidden = !menu.hidden; toggle.setAttribute('aria-expanded', String(!menu.hidden)); });\n  document.addEventListener('pointerdown', event => {\n    if (!header.contains(event.target) && !menu.contains(event.target)) closeMenu();\n  });\n  body.append(header, menu);\n  const panels = [\n    ['st-open', '__set'], ['fl-open', '__files'], ['sr-on', '__search'],\n    ['br-on', '__browser'], ['cl-on', '__collection'], ['tm-on', '__terminal'], ['rp-open', '__rp']\n  ];\n  const hasPanel = () => panels.some(([name]) => body.classList.contains(name)) ||\n    ['drw-open', 'mdl-open', 'pop-open'].some(name => body.classList.contains(name));\n  function closePanels() {\n    const wasOpen = hasPanel();\n    for (const [name, api] of panels) {\n      if (body.classList.contains(name)) window[api]?.close?.({quick:true});\n    }\n    window.__v13toggle?.(false);\n    window.__s2modal?.(false);\n    window.__s2pop?.(false);\n    window.__nav?.hideSoon?.();\n    closeMenu();\n    return wasOpen;\n  }\n  close.addEventListener('click', closePanels);\n  window.__phoneBack = () => {\n    if (!menu.hidden) { closeMenu(); return true; }\n    if (hasPanel()) { closePanels(); return true; }\n    return false;\n  };\n  const settingsSheet = document.getElementById('stSheet');\n  const settingsNote = document.createElement('p');\n  settingsNote.className = 'phone-settings-note';\n  settingsNote.textContent = '离线界面演示：账户、额度、引擎和权限为示例。尚未接入真实 API，请勿输入真实密钥。';\n  if (settingsSheet) settingsSheet.insertBefore(settingsNote, settingsSheet.querySelector('.st-sec'));\n  const settingCards = [];\n  document.querySelectorAll('#stSet .st-sec > .an').forEach(card => {\n    const useful = (card.classList.contains('c2pc') && !card.classList.contains('deco')) || !!card.querySelector('#stKey');\n    if (!useful) return;\n    card.classList.add('phone-setting-card');\n    const width = parseFloat(card.style.width) || card.offsetWidth || 340;\n    settingCards.push({card, width});\n  });\n  const demoKeyCard = document.getElementById('stKey')?.closest('.phone-setting-card');\n  demoKeyCard?.querySelectorAll('button').forEach(button => {\n    button.disabled = true;\n    button.title = '离线预览尚不支持真实密钥';\n  });\n  const syncPanelState = () => {\n    close.hidden = !hasPanel();\n    settingsSheet?.querySelectorAll('.st-tab').forEach(tab => {\n      const selected = tab.classList.contains('on');\n      tab.setAttribute('aria-selected', String(selected));\n    });\n  };\n  new MutationObserver(syncPanelState).observe(body, {attributes:true, attributeFilter:['class']});\n  syncPanelState();\n  const appearanceKey = 'trianon.phone.appearance.v1';\n  const systemTheme = matchMedia('(prefers-color-scheme: dark)');\n  const appearance = window.__set?.V?.appearance;\n  if (appearance) {\n    appearance.fontSize = 13;\n    try {\n      const saved = JSON.parse(localStorage.getItem(appearanceKey) || 'null');\n      if (saved && typeof saved === 'object') {\n        if (['light','dark','auto'].includes(saved.theme)) appearance.theme = saved.theme;\n        if (Number.isFinite(saved.fontSize)) appearance.fontSize = Math.max(12, Math.min(18, saved.fontSize));\n        if (['airy','standard','compact'].includes(saved.density)) appearance.density = saved.density;\n        if (['full','soft','reduce'].includes(saved.motion)) appearance.motion = saved.motion;\n        if (typeof saved.stickers === 'boolean') appearance.stickers = saved.stickers;\n      }\n    } catch (_) {}\n  }\n  let appearanceSnapshot = '';\n  function applyAppearance() {\n    if (!appearance) return;\n    const effective = appearance.theme === 'auto' ? (systemTheme.matches ? 'dark' : 'light') : appearance.theme;\n    if (body.dataset.phoneTheme !== effective) body.dataset.phoneTheme = effective;\n    if (body.dataset.phoneDensity !== appearance.density) body.dataset.phoneDensity = appearance.density;\n    const stickers = appearance.stickers ? 'on' : 'off';\n    if (body.dataset.phoneStickers !== stickers) body.dataset.phoneStickers = stickers;\n    root.style.setProperty('--phone-font', `${appearance.fontSize}px`);\n    document.querySelectorAll('#stSet .st-sw').forEach(card => {\n      const selected = card.dataset.v === appearance.theme;\n      card.classList.toggle('on', selected);\n      card.setAttribute('aria-checked', String(selected));\n      card.setAttribute('tabindex', '0');\n    });\n    const next = JSON.stringify(appearance);\n    if (next !== appearanceSnapshot) {\n      appearanceSnapshot = next;\n      try { localStorage.setItem(appearanceKey, next); } catch (_) {}\n    }\n    schedule();\n  }\n  const preview = document.getElementById('stPv');\n  if (preview) new MutationObserver(applyAppearance).observe(preview, {attributes:true});\n  document.getElementById('stSet')?.addEventListener('click', applyAppearance);\n  document.getElementById('stSet')?.addEventListener('keydown', event => {\n    const card = event.target.closest('.st-sw');\n    if (card && (event.key === 'Enter' || event.key === ' ')) {\n      event.preventDefault(); card.click();\n    }\n  });\n  systemTheme.addEventListener('change', applyAppearance);\n  const composer = document.querySelector('.composer');\n  let maxHeight = innerHeight;\n  let frame = 0;\n  function refresh() {\n    frame = 0;\n    const visual = window.visualViewport;\n    const height = Math.round(visual ? visual.height : innerHeight);\n    const width = document.documentElement.clientWidth;\n    if (width > 600) { root.style.removeProperty('--phone-height'); body.classList.remove('phone-keyboard'); return; }\n    maxHeight = Math.max(maxHeight, height);\n    const isInput = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '');\n    const keyboard = isInput && maxHeight - height > 120;\n    body.classList.toggle('phone-keyboard', keyboard);\n    root.style.setProperty('--phone-height', `${height}px`);\n    for (const {card, width: originalWidth} of settingCards) {\n      card.style.setProperty('--phone-card-scale', String(Math.min(1, (width - 36) / originalWidth)));\n      card.style.setProperty('--phone-option-scale', String(Math.min(1.08, (width - 30) / 2 / originalWidth)));\n    }\n    const composerHeight = composer ? composer.getBoundingClientRect().height : 148;\n    // Fit collage both horizontally and vertically, without scaling text fields.\n    const scale = Math.max(.15, Math.min((width - 24) / 700, (height - 54 - composerHeight - 28) / 560, .8));\n    root.style.setProperty('--phone-collage-scale', String(scale));\n    body.style.setProperty('--cH', `${Math.ceil(composerHeight)}px`);\n  }\n  function schedule() { if (!frame) frame = requestAnimationFrame(refresh); }\n  addEventListener('resize', schedule);\n  window.visualViewport?.addEventListener('resize', schedule);\n  addEventListener('orientationchange', () => { maxHeight = 0; schedule(); });\n  document.addEventListener('focusin', schedule);\n  document.addEventListener('focusout', () => { schedule(); setTimeout(schedule, 250); });\n  if (composer) new ResizeObserver(schedule).observe(composer);\n  applyAppearance();\n  refresh();\n})();\n"
          html = html.replace('</head>', '<style id="phoneLayout">' + mobile_css + '</style></head>', 1)
          html = html.replace('</body>', '<script>' + mobile_js + '</script></body>', 1)
          html = html.replace('<head>', '<head>' + '<script id="phoneEarlyBack">addEventListener(\'keydown\',function(e){if(innerWidth<=600&&e.key===\'Escape\'&&window.__phoneBack&&window.__phoneBack()){e.preventDefault();e.stopImmediatePropagation();}},true);</script>', 1)
          import hashlib, base64
          script_hashes = []
          for script in re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.S | re.I):
              digest = base64.b64encode(hashlib.sha256(script.encode('utf-8')).digest()).decode('ascii')
              script_hashes.append("'sha256-" + digest + "'")
          policy = "default-src 'none'; script-src " + ' '.join(script_hashes) + "; style-src 'unsafe-inline'; img-src data: blob: file:; font-src data: file:; media-src data: blob: file:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
          html = html.replace('<head>', '<head><meta http-equiv="Content-Security-Policy" content="' + policy + '">', 1)
          (assets / 'trianon.html').write_text(html, encoding='utf-8')
          for name in ('LICENSE', 'ASSETS.md'):
              shutil.copy2(name, assets / name)
