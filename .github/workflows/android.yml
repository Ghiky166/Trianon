      - name: Build installable APK
        working-directory: android-preview
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare download
        run: |
          mkdir -p apk-download
          cp android-preview/app/build/outputs/apk/debug/app-debug.apk apk-download/Trianon-preview-0.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trianon-preview-0.8-APK
          path: apk-download/
          if-no-files-found: error
          retention-days: 7
