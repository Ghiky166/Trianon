          const picture=(key,cls)=>`<img class="sr-k ${cls}" src="${IMG[key]}" alt="" aria-hidden="true" draggable="false">`;
          const search=`<div class="sr-hero" aria-hidden="true">
          <div class="sr-clouds"><i></i><i></i></div>
          ${picture('building','sr-bld')}${picture('temple','sr-tmp')}${picture('column','sr-col')}${picture('ladder','sr-lad')}${picture('angel','sr-ang')}${picture('dove','sr-dove')}
          <svg class="sr-arch" viewBox="0 0 360 260"><path class="sr-as s2" d="${path}"/><path class="sr-ab" d="${path}"/><path class="sr-al" fill="none" d="M102 246 V114 A78 78 0 0 1 258 114 V246"/></svg>
          <svg class="sr-hud" viewBox="0 0 360 260"><defs><path id="srMobileRing" d="M180 54 A81 81 0 1 1 180 216 A81 81 0 1 1 180 54"/></defs><circle class="sr-ring" cx="180" cy="135" r="70"/><g>${ticks}</g><text class="sr-rt"><textPath href="#srMobileRing" startOffset="8%">CHERCHER · SÉANCES · MESSAGES · SOUVENIRS ·</textPath></text></svg>
          <div class="sr-head"><span class="sr-lab"><i>RECHERCHE · 09</i></span><b class="sr-hw">搜索</b><em>Chercher</em><span class="sr-hs">SESSIONS &amp; MESSAGES</span></div></div>
