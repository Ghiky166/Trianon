          window.__archiveDecor={history:HISTORY,flower:FLOWER,envelope:ENVELOPE,icons:ICONS,search};
          document.body.insertAdjacentHTML('beforeend',DEFS);
          '''
              for token,value in [('HISTORY',history),('FLOWER',flower),('ENVELOPE',envelope),('ICONS',icons),('DEFS',defs)]:
                  render=render.replace(token,json.dumps(value,ensure_ascii=False))
              decor='(()=>{\n'+images+arch+render+'\n})();'
              cache={}
              (assets/'media').mkdir(exist_ok=True)
              def external(m):
                  uri=m[0]
                  if uri in cache:return cache[uri]
                  mime,payload=uri.split(';base64,',1);data=base64.b64decode(payload)
                  ext={'data:image/png':'png','data:image/jpeg':'jpg','data:image/webp':'webp','data:font/woff2':'woff2','data:font/woff':'woff'}.get(mime,'bin')
                  if mime.startswith('data:image/'):
                      im=Image.open(io.BytesIO(data))
                      if max(im.size)>900:
                          im.thumbnail((900,900),Image.Resampling.LANCZOS);buf=io.BytesIO();im.save(buf,format='WEBP',quality=90,method=4);data=buf.getvalue();ext='webp'
                  path='media/'+hashlib.sha256(data).hexdigest()[:24]+'.'+ext
                  (assets/path).write_bytes(data);cache[uri]=path;return path
              def write(name,text):
