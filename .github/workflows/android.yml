name: Build Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'dist/trianon.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare preview application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import textwrap

          root = Path('android-preview')
          def write(path, content):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding='utf-8')

          write('settings.gradle', '''
              pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
              dependencyResolutionManagement { repositories { google(); mavenCentral() } }
              rootProject.name = 'TrianonPreview'
              include ':app'
          ''')
          write('build.gradle', '''
              plugins { id 'com.android.application' version '8.9.1' apply false }
          ''')
          write('app/build.gradle', '''
              plugins { id 'com.android.application' }
              android {
                  namespace 'app.ghiky166.trianon.preview'
                  compileSdk 35
                  defaultConfig {
                      applicationId 'app.ghiky166.trianon.preview'
                      minSdk 26
                      targetSdk 35
                      versionCode 1
                      versionName '0.1-preview'
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
          ''')
          write('app/src/main/AndroidManifest.xml', '''
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <application android:label="Trianon 预览" android:allowBackup="false"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar"
                      android:supportsRtl="true" android:usesCleartextTraffic="false">
                      <activity android:name=".MainActivity" android:exported="true"
                          android:windowSoftInputMode="adjustResize">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          ''')
          write('app/src/main/java/app/ghiky166/trianon/preview/MainActivity.java', '''
              package app.ghiky166.trianon.preview;
              import android.app.Activity;
              import android.os.Bundle;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;
              import android.webkit.WebResourceRequest;
              import android.content.Intent;
              import android.net.Uri;

              public class MainActivity extends Activity {
                  private WebView web;
                  @Override public void onCreate(Bundle state) {
                      super.onCreate(state);
                      web = new WebView(this);
                      web.getSettings().setJavaScriptEnabled(true);
                      web.getSettings().setDomStorageEnabled(true);
                      web.getSettings().setAllowFileAccess(true);
                      web.getSettings().setAllowContentAccess(false);
                      web.getSettings().setUseWideViewPort(true);
                      web.getSettings().setLoadWithOverviewMode(true);
                      web.getSettings().setBuiltInZoomControls(true);
                      web.getSettings().setDisplayZoomControls(false);
                      web.setWebViewClient(new WebViewClient() {
                          @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                              String url = r.getUrl().toString();
                              if (url.startsWith("file:///android_asset/") || url.equals("about:blank")) return false;
                              if (r.isForMainFrame() && (url.startsWith("https://") || url.startsWith("http://"))) {
                                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                                  catch (android.content.ActivityNotFoundException ignored) { }
                              }
                              return true;
                          }
                      });
                      setContentView(web);
                      web.loadUrl("file:///android_asset/trianon.html#empty");
                  }
                  @Override public void onBackPressed() {
                      if (web.canGoBack()) web.goBack(); else super.onBackPressed();
                  }
                  @Override protected void onDestroy() {
                      if (web != null) { web.stopLoading(); web.destroy(); }
                      super.onDestroy();
                  }
              }
          ''')
          assets = root / 'app/src/main/assets'
          assets.mkdir(parents=True, exist_ok=True)
          source = Path('dist/trianon.html')
          if not source.is_file():
              raise SystemExit('Missing dist/trianon.html in the repository')
          shutil.copy2(source, assets / 'trianon.html')
          for name in ('LICENSE', 'ASSETS.md'):
              shutil.copy2(name, assets / name)
          if Path('licenses').is_dir():
              shutil.copytree('licenses', assets / 'licenses', dirs_exist_ok=True)
          print('Preview prepared. This build contains the original demo UI, not live AI or file tools.')
          PY

      - name: Build installable APK
        working-directory: android-preview
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare download
        run: |
          mkdir -p apk-download
          cp android-preview/app/build/outputs/apk/debug/app-debug.apk apk-download/Trianon-preview.apk
          printf '%s\n' 'Trianon preview: UI demo only. AI chat and phone file editing are not implemented yet.' 'This is a debug preview. Signing may change between builds; do not store important data in it.' > apk-download/README.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trianon-preview-APK
          path: apk-download/
          if-no-files-found: error
          retention-days: 7
