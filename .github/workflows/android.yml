-width:100%!important; min-width:0!important; }\n  html body .thread .b { width:auto!important; max-width:100%!important; font-size:15px!important; line-height:1.8!important; padding:12px 14px 18px!important; white-space:normal!important; }\n  html body .thread .b img, html body .thread .b video, html body .thread .b canvas { max-width:100%!important; height:auto!important; }\n  html body .thread .b table { width:100%!important; table-layout:fixed; overflow-wrap:anywhere; }\n  html body .thread .b::after { max-width:85%; font-size:10px!important; }\n  html body .thread .rnd { width:32px!important; height:auto!important; max-width:32px!important; left:auto!important; right:4px!important; top:-12px!important; transform:none!important; }\n  html body .thread .sl-hair { inset:0!important; }\n  html body .thread .out .b::before { content:none!important; }\n  html body .thread .sl-paper > .rec { flex-wrap:wrap!important; white-space:normal!important; padding:6px 12px!important; box-sizing:border-box!important; }\n  html body .thread .slip, html body .thread .qcard { width:100%!important; max-width:100%!important; min-width:0!important; margin-left:0!important; box-sizing:border-box!important; }\n  html body .thread .sl-full, html body .thread .q-full { padding:16px 12px!important; box-sizing:border-box!important; }\n  html body .thread .sl-paper, html body .thread .q-paper { max-width:100%!important; box-sizing:border-box!important; }\n  html body .thread .sl-eb, html body .thread .sl-tt, html body .thread .sl-file, html body .thread .sl-act { flex-wrap:wrap!important; gap:8px!important; white-space:normal!important; }\n  html body .thread .sl-file .p { min-width:0!important; flex:1 1 120px!important; overflow-wrap:anywhere!important; }\n  html body .thread .sl-act button { min-height:44px!important; height:auto!important; padding:8px 12px!important; }\n  html body .thread .sl-act kbd { display:none!important; }\n  html body .thread .sl-no { margin-left:0!important; }\n  html body .thread .sl-diff, html body .thread .sl-cmd, html body .thread pre, html body .thread .tb,\n  html body .thread .prf-code { max-width:100%!important; box-sizing:border-box!important; overflow-x:auto!important; white-space:pre-wrap!important; overflow-wrap:anywhere!important; }\n  html body .thread .sl-diff .ln, html body .thread .sl-diff .hk, html body .thread .so-l { white-space:pre-wrap!important; height:auto!important; min-height:19px; overflow-wrap:anywhere!important; }\n  html body .thread .prf-w { margin-left:0!important; margin-right:0!important; }\n  html body .thread .th, html body .thread .tn-h { flex-wrap:wrap!important; padding:9px 12px!important; }\n  html body .thread .tg-l { box-sizing:border-box!important; height:auto!important; min-height:38px; padding:8px!important; font-size:11px!important; white-space:normal!important; }\n  html body .thread .tg-l .ar { min-width:0!important; overflow-wrap:anywhere!important; }\n  html body .thread .ap-seal, html body .thread .sl-seal { display:none!important; }\n  #phoneHeader { z-index:2147483000!important; }\n  #phoneMenu { z-index:2147483001!important; }\n  #phoneHeader #phoneClose { font:13px sans-serif!important; padding:6px 8px; min-width:66px; }\n  #phoneHeader #phoneClose[hidden] { display:none!important; }\n  #phoneHeader small { font-size:10px!important; }\n  html body #stSet { top:50px!important; bottom:auto!important; height:calc(var(--phone-height,100vh) - 50px)!important; overflow-x:hidden!important; overflow-y:auto!important; overscroll-behavior:contain; background:#e5eaf4; }\n  html body #stSet #stSheet { position:relative!important; left:auto!important; top:auto!important; width:100%!important; height:auto!important; min-height:100%!important; padding:12px!important; box-sizing:border-box!important; display:flex!important; flex-wrap:wrap!important; align-content:flex-start!important; gap:8px!important; transform:none!important; }\n  html body #stSheet > :not(.st-tab):not(.st-sec):not(.