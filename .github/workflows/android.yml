es(query)||s.messages.some(m=>m.text.toLowerCase().includes(query))));\n      const group=element('div','dw-grp');group.append(element('em',null,scope==='pinned'?'Épinglé':'Séances'),document.createTextNode(' '+found.length+' 封信笺'));list.append(group);\n      if(!found.length){const note=element('div','archive-empty');note.innerHTML=window.__archiveDecor.envelope;note.append(element('em',null,'Une page à écrire'),element('p',null,query?'没有找到匹配的会话。':scope==='pinned'?'还没有置顶的信笺。':'还没有会话，写下第一句话吧。'));list.append(note)}\n      for(const session of found){\n        const wrap=element('div','archive-row'+(session===current?' current':''));\n        const card=button('',()=>sessionOpen(session),'history-card dw-ses'+(session===current?' cur':''));\n        if(session===current)card.append(fragment(window.__archiveDecor.flower));\n        card.append(element('strong','dw-t',session.title));const meta=element('span','dw-m');meta.append(element('span','dw-tag',session.messages.length+' 条消息'),element('span','dw-when',session.date));card.append(meta);\n        const text=session.messages.find(m=>m.role==='user');if(text)card.append(element('p','archive-excerpt',text.text.slice(0,76)));\n        const pin=button(session.pinned?'已置顶':'置顶',()=>{session.pinned=!session.pinned;render()},'archive-pin');pin.setAttribute('aria-pressed',String(!!session.pinned));pin.setAttribute('aria-label',(session.pinned?'取消置顶 ':'置顶 ')+session.title);\n        wrap.append(card,pin);list.append(wrap);\n      }\n      tabs.forEach(t=>{t.classList.toggle('on',t.dataset.scope===scope);t.setAttribute('aria-selected',String(t.dataset.scope===scope))});\n    };\n    tabs.forEach(t=>t.addEventListener('click',()=>{scope=t.dataset.scope;render()}));input.addEventListener('input',render);render();\n    const foot=element('p','archive-foot','本次打开期间的会话 · 轻点信笺继续对话');interior.append(foot);\n  }\n  function searchSheet(){\n    const page=newSheet('search','搜索','Chercher');page.id='sr';page.classList.add('on','nogl','