          <div class="sr-pn"><div class="sr-ph2"><span class="sr-nn">01</span><b>RÉSULTATS · 结果</b><em>LOCAL</em></div><p class="sr-status" aria-live="polite"></p><div class="sr-res" id="phoneSearchResults" aria-label="搜索结果"></div></div>
          <div class="sr-pn"><div class="sr-ph2"><span class="sr-nn">02</span><b>DÉTAIL · 命中全文</b></div><div class="sr-sky-intro"><div class="sr-mobile-diamond" style="background-image:url(${IMG.sky})"><svg viewBox="0 0 100 100"><path d="M50 3 L97 50 L50 97 L3 50Z" fill="none" stroke="#fffdf8" stroke-width="5"/><path d="M50 4 L96 50 L50 96 L4 50Z" fill="none" stroke="#7c8eaf" stroke-width=".6"/></svg></div><p><em>Dans le ciel</em>把走失的句子，<br>一封一封找回来。</p></div><div class="sr-detail" aria-live="polite"></div></div>
