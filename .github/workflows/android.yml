              history='<div class="drw-mv">'+paper+ribbon+'<div class="drw-in">'+heading+label+new+tabs+'<div class="dw-list"></div><button type="button" class="archive-search">Chercher · 打开云天搜索 ↗</button></div></div>'
              # Original die-cut navigation objects, reused at phone size instead of re-enabling the desktop rail.
              rail=d.part(d.find(cls='rail'))
              rail_images=re.findall(r'<img\b[^>]*class="tg"[^>]*src="([^"]+)"',rail)
              assert len(rail_images)==11
              icons=[rail_images[i] for i in (0,1,2,3,7,10,5,2)]
              # Extract just the original image table and arch generator; no demo DB, frame loop, or shaders.
              sr=scripts[16]
              images=sr[sr.index('const IMG='):sr.index('const esc=')]
              arch=sr[sr.index('const ARCH='):sr.index('root.innerHTML=')]
              render=r'''
          const path=ARCH(89,18,271,250,9);
