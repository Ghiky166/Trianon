      - name: Build installable APK
        working-directory: android-preview
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare download
        run: |
          mkdir -p apk-download
          cp android-preview/app/build/outputs/apk/debug/app-debug.apk apk-download/Trianon-preview-0.6.apk
          printf '%s\n' 'Trianon preview: UI demo only. AI chat and phone file editing are not implemented yet.' 'This is a debug preview. Signing may change between builds; do not store important data in it.' > apk-download/README.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trianon-preview-0.6-APK
          path: apk-download/
          if-no-files-found: error
          retention-days: 7
