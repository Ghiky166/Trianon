name: Build Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'dist/trianon.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare preview application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import textwrap

          root = Path('android-preview')
          def write(path, content):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding='utf-8')

          write('settings.gradle', '''
              pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
              dependencyResolutionManagement { repositories { google(); mavenCentral() } }
              rootProject.name = 'TrianonPreview'
              include ':app'
          ''')
          write('build.gradle', '''
              plugins { id 'com.android.application' version '8.9.1' apply false }
          ''')
          write('app/build.gradle', '''
              plugins { id 'com.android.application' }
              android {
                  namespace 'app.ghiky166.trianon.preview'
                  compileSdk 35
                  defaultConfig {
                      applicationId 'app.ghiky166.trianon.preview'
                      minSdk 26
                      targetSdk 35
                      versionCode 4
                      versionName '0.4-preview'
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
          ''')
          write('app/src/main/AndroidManifest.xml', '''
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <application android:label="Trianon 预览" android:allowBackup="false" android:enableOnBackInvokedCallback="false"
                      android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar"
                      android:supportsRtl="true" android:usesCleartextTraffic="false">
                      <activity android:name=".MainActivity" android:exported="true"
                          android:windowSoftInputMode="adjustResize">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          ''')
          write('app/src/main/res/drawable/ic_trianon_background.xml', '''
              <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
                  <solid android:color="#B9CADE" />
              </shape>
          ''')
          write('app/src/main/res/drawable/ic_trianon_foreground.xml', '''
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#8FA8C5" android:pathData="M28,39 L80,39 Q84,39 84,43 L84,72 Q84,77 79,77 L29,77 Q24,77 24,72 L24,43 Q24,39 28,39 Z" />
                  <path android:fillColor="#FCF8EE" android:strokeColor="#738BA9" android:strokeWidth="1.2"
                      android:pathData="M28,35 L80,35 Q83,35 83,39 L83,69 Q83,73 79,73 L29,73 Q25,73 25,69 L25,39 Q25,35 28,35 Z" />
                  <path android:fillColor="#F1ECDF" android:strokeColor="#A4B3C5" android:strokeWidth="0.8"
                      android:pathData="M26,71 L47,52 Q54,47 61,52 L82,71 Z" />
                  <path android:fillColor="#FFFCF5" android:strokeColor="#738BA9" android:strokeWidth="1.2"
                      android:pathData="M26,37 L50,56 Q54,59 58,56 L82,37" />
                  <path android:fillColor="#6982A8" android:strokeColor="#E1E7EF" android:strokeWidth="1"
                      android:pathData="M64,61 A10,10 0,1 1,44 61 A10,10 0,1 1,64 61 Z" />
                  <path android:fillColor="#FFF8E7" android:pathData="M48,55 L60,55 L60,58 L59,58 L58,56.5 L55,56.5 L55,66 L57,66 L57,67 L51,67 L51,66 L53,66 L53,56.5 L50,56.5 L49,58 L48,58 Z" />
              </vector>
          ''')
          for icon_name in ('ic_launcher', 'ic_launcher_round'):
              write(f'app/src/main/res/mipmap-anydpi-v26/{icon_name}.xml', '''
                  <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                      <background android:drawable="@drawable/ic_trianon_background" />
                      <foreground android:drawable="@drawable/ic_trianon_foreground" />
                  </adaptive-icon>
              ''')
          write('app/src/main/java/app/ghiky166/trianon/preview/MainActivity.java', '''
              package app.ghiky166.trianon.preview;
              import android.app.Activity;
              import android.os.Bundle;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;
              import android.webkit.WebResourceRequest;
              import android.content.Intent;
              import android.net.Uri;

              public class MainActivity extends Activity {
                  private WebView web;
                  @Override public void onCreate(Bundle state) {
                      super.onCreate(state);
                      web = new WebView(this);
                      web.getSettings().setJavaScriptEnabled(true);
                      web.getSettings().setDomStorageEnabled(true);
                      web.getSettings().setAllowFileAccess(true);
                      web.getSettings().setAllowContentAccess(false);
                      web.getSettings().setAllowFileAccessFromFileURLs(false);
                      web.getSettings().setAllowUniversalAccessFromFileURLs(false);
                      web.getSettings().setBlockNetworkLoads(true);
                      web.getSettings().setMixedContentMode(android.webkit.WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                      android.webkit.CookieManager.getInstance().setAcceptThirdPartyCookies(web, false);
                      web.getSettings().setUseWideViewPort(true);
                      web.setInitialScale(100);
                      web.getSettings().setLoadWithOverviewMode(false);
                      web.getSettings().setBuiltInZoomControls(true);
                      web.getSettings().setDisplayZoomControls(false);
                      web.setWebViewClient(new WebViewClient() {
                          @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                              String url = r.getUrl().toString();
                              if (url.startsWith("file:///android_asset/") || url.equals("about:blank")) return false;
                              if (r.isForMainFrame() && (url.startsWith("https://") || url.startsWith("http://"))) {
                                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                                  catch (android.content.ActivityNotFoundException ignored) { }
                              }
                              return true;
                          }
                      });
                      setContentView(web);
                      web.loadUrl("file:///android_asset/trianon.html#empty");
                  }
                  @Override public void onBackPressed() {
                      if (web == null) { super.onBackPressed(); return; }
                      web.evaluateJavascript("Boolean(window.__phoneBack && window.__phoneBack())", result -> {
                          if (!"true".equals(result)) {
                              if (web.canGoBack()) web.goBack(); else finish();
                          }
                      });
                  }
                  @Override protected void onDestroy() {
                      if (web != null) { web.stopLoading(); web.destroy(); }
                      super.onDestroy();
                  }
              }
          ''')
          assets = root / 'app/src/main/assets'
          assets.mkdir(parents=True, exist_ok=True)
          source = Path('dist/trianon.html')
          if not source.is_file():
              raise SystemExit('Missing dist/trianon.html in the repository')
          import re
          html = source.read_text(encoding='utf-8')
          html = re.sub(r'<meta\b[^>]*name=[\"\']viewport[\"\'][^>]*>', '', html, flags=re.I)
          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
          html = html.replace('<head>', '<head>' + viewport, 1)
          mobile_css = '/* Phone layout v0.3: keep controls at readable size; scale only decorative collage. */\n@media (max-width: 600px) {\n  html, body { width:100%!important; height:100%!important; min-width:0!important; margin:0!important; overflow:hidden!important; -webkit-text-size-adjust:100%; }\n  .app { inset:0!important; width:100%!important; height:var(--phone-height,100%)!important; min-width:0!important; }\n  html body .stage { width:100%!important; min-width:0!important; transform:none!important; padding:0!important; }\n  html body .thread, html body .wrap, html body:not(.rp-open):not(.fl-open) .thread,\n  html body:not(.rp-open):not(.fl-open) .wrap { width:100%!important; max-width:100%!important; min-width:0!important; box-sizing:border-box!important; transition:none!important; }\n  html body .composer { flex:none!important; width:100%!important; box-sizing:border-box!important; padding:8px 10px max(12px,env(safe-area-inset-bottom))!important; margin:0!important; }\n  html body .wrap { align-items:flex-end!important; gap:5px!important; }\n  html body .field { flex:1 1 0!important; min-width:0!important; box-sizing:border-box!important; padding:13px 12px 12px!important; }\n  html body .field .fbow { display:none!important; }\n  html body .field .ph { height:38px!important; gap:6px!important; min-width:0!important; overflow:hidden!important; }\n  html body .field .ph em { font-size:18px!important; white-space:nowrap; }\n  html body .field .ph .pht { font-size:13px!important; white-space:nowrap; }\n  html body input.ci, html body input, html body textarea { font-size:16px!important; }\n  html body .field .ph .ci { box-sizing:border-box!important; width:100%!important; min-width:0!important; }\n  html body .field .bar { display:flex!important; flex-wrap:wrap!important; align-items:center!important; gap:5px 3px!important; }\n  html body .field .bar .pill { flex:none!important; font-size:11px!important; max-width:100%!important; box-sizing:border-box!important; }\n  html body .field .bar .plus { min-width:28px!important; min-height:28px!important; display:grid!important; place-items:center!important; }\n  html body .composer .field .bar .mchip { flex:none!important; margin:0 0 0 auto!important; max-width:100%!important; font-size:11px!important; min-height:28px!important; }\n  html body .send { flex:0 0 48px!important; width:48px!important; height:58px!important; margin:0 0 8px!important; }\n  html body .send img { max-width:100%!important; max-height:100%!important; object-fit:contain!important; }\n  html body .send .sl { font-size:9px!important; }\n  html body .vw { top:54px!important; bottom:var(--cH,148px)!important; min-height:0!important; overflow:auto!important; overscroll-behavior:contain; }\n  html body .scroll { padding:8px 12px!important; box-sizing:border-box!important; }\n  html body #vEmpty { padding:0 8px!important; overflow:hidden!important; }\n  html body #vEmpty .hall { width:100%!important; height:100%!important; min-width:0!important; padding:0!important; justify-content:center!important; box-sizing:border-box!important; }\n  html body #vEmpty .dsep { width:100%!important; flex:none!important; margin:0 0 4px!important; font-size:10px!important; }\n  html body #vEmpty .invite.c5i { width:700px!important; height:560px!important; zoom:var(--phone-collage-scale,.48)!important; flex:none!important; }\n  html body .row { max-width:100%!important; box-sizing:border-box!important; }\n  html body .b, html body .tool, html body pre { max-width:100%!important; min-width:0!important; box-sizing:border-box!important; overflow-wrap:anywhere; }\n  html body pre { overflow:auto!important; }\n  html body .rail { visibility:hidden!important; pointer-events:none!important; left:-150px!important; }\n  html body .edge, html body #rpTab { display:none!important; }\n  #phoneHeader { position:fixed; z-index:120; left:0; right:0; top:0; height:50px; display:flex; align-items:center; gap:10px; padding:0 12px; background:rgba(242,245,250,.9); border-bottom:1px solid #becbdd; box-sizing:border-box; color:#425779; font:16px Georgia,serif; }\n  #phoneHeader small { margin-left:auto; font:11px sans-serif; color:#667b96; }\n  #phoneHeader button { min-width:40px; min-height:40px; border:1px solid #b5c4d8; border-radius:12px; background:#faf9f4; color:#425779; font-size:20px; }\n  #phoneMenu { position:fixed; top:54px; left:10px; z-index:121; max-height:calc(var(--phone-height,100vh) - 72px); width:min(270px,calc(100vw - 20px)); overflow:auto; padding:8px; box-sizing:border-box; border:1px solid #b5c4d8; border-radius:14px; background:#f9f8f2; box-shadow:0 8px 25px #40507033; }\n  #phoneMenu[hidden] { display:none!important; }\n  #phoneMenu button { display:block; width:100%; min-height:44px; text-align:left; padding:8px 12px; margin:2px 0; border:0; border-radius:8px; background:#e8edf5; color:#425779; font-size:15px; }\n  body.phone-keyboard #vEmpty .hall { visibility:hidden!important; }\n  /* Keep desktop auxiliary sheets reachable; their inner designs will be adapted separately. */\n  html body .folio { max-width:calc(100vw - 12px)!important; right:6px!important; }\n}\n@media (min-width:601px) { #phoneHeader, #phoneMenu { display:none!important; } }\n\n/* Chat columns, tool results and settings must fit independently of the composer. */\n@media (max-width:600px) {\n  html body .vw { overflow-x:hidden!important; overflow-y:auto!important; touch-action:pan-y pinch-zoom; }\n  html body .scroll.chat { display:block!important; padding:16px 12px 28px!important; -webkit-mask:none!important; mask:none!important; }\n  html body .scroll.chat .thread { height:auto!important; min-height:100%!important; flex:none!important; transform:none!important; padding:0!important; }\n  html body .thread .row, html body .thread .row.in { width:100%!important; min-width:0!important; flex:none!important; margin-top:20px!important; }\n  html body .thread .row .col { flex:1 1 0!important; width:100%!important; max-width:100%!important; min-width:0!important; }\n  html body .thread .b { width:auto!important; max-width:100%!important; font-size:15px!important; line-height:1.8!important; padding:12px 14px 18px!important; white-space:normal!important; }\n  html body .thread .b img, html body .thread .b video, html body .thread .b canvas { max-width:100%!important; height:auto!important; }\n  html body .thread .b table { width:100%!important; table-layout:fixed; overflow-wrap:anywhere; }\n  html body .thread .b::after { max-width:85%; font-size:10px!important; }\n  html body .thread .rnd { width:32px!important; height:auto!important; max-width:32px!important; left:auto!important; right:4px!important; top:-12px!important; transform:none!important; }\n  html body .thread .sl-hair { inset:0!important; }\n  html body .thread .out .b::before { content:none!important; }\n  html body .thread .sl-paper > .rec { flex-wrap:wrap!important; white-space:normal!important; padding:6px 12px!important; box-sizing:border-box!important; }\n  html body .thread .slip, html body .thread .qcard { width:100%!important; max-width:100%!important; min-width:0!important; margin-left:0!important; box-sizing:border-box!important; }\n  html body .thread .sl-full, html body .thread .q-full { padding:16px 12px!important; box-sizing:border-box!important; }\n  html body .thread .sl-paper, html body .thread .q-paper { max-width:100%!important; box-sizing:border-box!important; }\n  html body .thread .sl-eb, html body .thread .sl-tt, html body .thread .sl-file, html body .thread .sl-act { flex-wrap:wrap!important; gap:8px!important; white-space:normal!important; }\n  html body .thread .sl-file .p { min-width:0!important; flex:1 1 120px!important; overflow-wrap:anywhere!important; }\n  html body .thread .sl-act button { min-height:44px!important; height:auto!important; padding:8px 12px!important; }\n  html body .thread .sl-act kbd { display:none!important; }\n  html body .thread .sl-no { margin-left:0!important; }\n  html body .thread .sl-diff, html body .thread .sl-cmd, html body .thread pre, html body .thread .tb,\n  html body .thread .prf-code { max-width:100%!important; box-sizing:border-box!important; overflow-x:auto!important; white-space:pre-wrap!important; overflow-wrap:anywhere!important; }\n  html body .thread .sl-diff .ln, html body .thread .sl-diff .hk, html body .thread .so-l { white-space:pre-wrap!important; height:auto!important; min-height:19px; overflow-wrap:anywhere!important; }\n  html body .thread .prf-w { margin-left:0!important; margin-right:0!important; }\n  html body .thread .th, html body .thread .tn-h { flex-wrap:wrap!important; padding:9px 12px!important; }\n  html body .thread .tg-l { box-sizing:border-box!important; height:auto!important; min-height:38px; padding:8px!important; font-size:11px!important; white-space:normal!important; }\n  html body .thread .tg-l .ar { min-width:0!important; overflow-wrap:anywhere!important; }\n  html body .thread .ap-seal, html body .thread .sl-seal { display:none!important; }\n  #phoneHeader { z-index:2147483000!important; }\n  #phoneMenu { z-index:2147483001!important; }\n  #phoneHeader #phoneClose { font:13px sans-serif!important; padding:6px 8px; min-width:66px; }\n  #phoneHeader #phoneClose[hidden] { display:none!important; }\n  #phoneHeader small { font-size:10px!important; }\n  html body #stSet { top:50px!important; bottom:auto!important; height:calc(var(--phone-height,100vh) - 50px)!important; overflow-x:hidden!important; overflow-y:auto!important; overscroll-behavior:contain; background:#e5eaf4; }\n  html body #stSet #stSheet { position:relative!important; left:auto!important; top:auto!important; width:100%!important; height:auto!important; min-height:100%!important; padding:12px!important; box-sizing:border-box!important; display:flex!important; flex-wrap:wrap!important; align-content:flex-start!important; gap:8px!important; transform:none!important; }\n  html body #stSheet > :not(.st-tab):not(.st-sec):not(.phone-settings-note) { display:none!important; }\n  html body #stSet #stSheet > .st-tab { position:relative!important; left:auto!important; top:auto!important; inset:auto!important; width:calc(50% - 4px)!important; height:48px!important; margin:0!important; transform:none!important; opacity:1!important; border:1px solid #adbbd3!important; border-radius:10px!important; background:#f8f8f3!important; font-size:14px!important; clip-path:none!important; }\n  html body #stSet #stSheet > .st-tab.on { background:#c9d5ea!important; }\n  html body #stSet #stSheet > .st-tab > :not(.tab-zh) { pointer-events:none; }\n  html body #stSet #stSheet > .st-sec { display:none!important; }\n  html body #stSet #stSheet > .st-sec.on { position:relative!important; inset:auto!important; width:100%!important; display:flex!important; flex-direction:column!important; align-items:center!important; gap:16px!important; padding:12px 0!important; pointer-events:auto!important; }\n  html body #stSet .st-sec > * { display:none!important; }\n  html body #stSet .st-sec > .phone-setting-card { display:block!important; position:relative!important; inset:auto!important; left:auto!important; top:auto!important; flex:none!important; margin:0!important; transform:none!important; opacity:1!important; zoom:var(--phone-card-scale,1)!important; }\n  html body #stSet .phone-settings-note { width:100%; margin:0; padding:10px; box-sizing:border-box; background:#faf9f2; border:1px dashed #a1b4cf; border-radius:10px; color:#455879; font-size:13px; line-height:1.6; }\n  html body #stSet .st-sec > .phone-setting-card .ky-in input { pointer-events:none!important; }\n  html body #stSet .st-sec > .c2-strip.phone-setting-card { width:100%!important; height:auto!important; min-height:52px!important; zoom:1!important; background:#faf9f2; border:1px dashed #a1b4cf; border-radius:8px; }\n  html body #stSet .st-sec > .c2-strip.phone-setting-card > svg { display:none!important; }\n  html body #stSet .st-sec > .c2-strip.phone-setting-card .ct { position:relative!important; inset:auto!important; height:auto!important; padding:10px!important; box-sizing:border-box!important; }\n  html body #stSet .c2-strip.phone-setting-card .c2dy { max-width:100%!important; white-space:normal!important; overflow-wrap:anywhere!important; font-size:12px!important; line-height:1.6!important; }\n}\n@media (min-width:601px) { #phoneClose, .phone-settings-note { display:none!important; } }\n'
          mobile_js = "(() => {\n  'use strict';\n  const root = document.documentElement;\n  const body = document.body;\n  const header = document.createElement('header');\n  header.id = 'phoneHeader';\n  const toggle = document.createElement('button');\n  toggle.type = 'button'; toggle.textContent = '☰';\n  toggle.setAttribute('aria-label', '打开功能菜单');\n  toggle.setAttribute('aria-expanded', 'false');\n  const title = document.createElement('span'); title.textContent = 'Trianon';\n  const badge = document.createElement('small'); badge.textContent = '离线预览 0.4';\n  const close = document.createElement('button'); close.id = 'phoneClose';\n  close.type = 'button'; close.textContent = '✕ 返回'; close.hidden = true;\n  close.setAttribute('aria-label', '关闭面板，返回聊天');\n  header.append(toggle, title, badge, close);\n  const menu = document.createElement('nav');\n  menu.id = 'phoneMenu'; menu.hidden = true; menu.setAttribute('aria-label', '功能菜单');\n  document.querySelectorAll('.rail .it').forEach((original, index) => {\n    const label = original.getAttribute('aria-label') || original.textContent.trim();\n    if (!label) return;\n    const button = document.createElement('button'); button.type = 'button';\n    button.textContent = label;\n    button.addEventListener('click', () => { closeMenu(); original.click(); });\n    menu.appendChild(button);\n  });\n  function closeMenu() { menu.hidden = true; toggle.setAttribute('aria-expanded', 'false'); }\n  toggle.addEventListener('click', () => { menu.hidden = !menu.hidden; toggle.setAttribute('aria-expanded', String(!menu.hidden)); });\n  document.addEventListener('pointerdown', event => {\n    if (!header.contains(event.target) && !menu.contains(event.target)) closeMenu();\n  });\n  body.append(header, menu);\n  const panels = [\n    ['st-open', '__set'], ['fl-open', '__files'], ['sr-on', '__search'],\n    ['br-on', '__browser'], ['cl-on', '__collection'], ['tm-on', '__terminal'], ['rp-open', '__rp']\n  ];\n  const hasPanel = () => panels.some(([name]) => body.classList.contains(name)) ||\n    ['drw-open', 'mdl-open', 'pop-open'].some(name => body.classList.contains(name));\n  function closePanels() {\n    const wasOpen = hasPanel();\n    for (const [name, api] of panels) {\n      if (body.classList.contains(name)) window[api]?.close?.({quick:true});\n    }\n    window.__v13toggle?.(false);\n    window.__s2modal?.(false);\n    window.__s2pop?.(false);\n    window.__nav?.hideSoon?.();\n    closeMenu();\n    return wasOpen;\n  }\n  close.addEventListener('click', closePanels);\n  window.__phoneBack = () => {\n    if (!menu.hidden) { closeMenu(); return true; }\n    if (hasPanel()) { closePanels(); return true; }\n    return false;\n  };\n  const settingsSheet = document.getElementById('stSheet');\n  const settingsNote = document.createElement('p');\n  settingsNote.className = 'phone-settings-note';\n  settingsNote.textContent = '离线界面演示：账户、额度、引擎和权限为示例。尚未接入真实 API，请勿输入真实密钥。';\n  if (settingsSheet) settingsSheet.insertBefore(settingsNote, settingsSheet.querySelector('.st-sec'));\n  const settingCards = [];\n  document.querySelectorAll('#stSet .st-sec > .an').forEach(card => {\n    const useful = (card.classList.contains('c2pc') && !card.classList.contains('deco')) || !!card.querySelector('#stKey');\n    if (!useful) return;\n    card.classList.add('phone-setting-card');\n    const width = parseFloat(card.style.width) || card.offsetWidth || 340;\n    settingCards.push({card, width});\n  });\n  const demoKeyCard = document.getElementById('stKey')?.closest('.phone-setting-card');\n  demoKeyCard?.querySelectorAll('button').forEach(button => {\n    button.disabled = true;\n    button.title = '离线预览尚不支持真实密钥';\n  });\n  const syncPanelState = () => {\n    close.hidden = !hasPanel();\n    settingsSheet?.querySelectorAll('.st-tab').forEach(tab => {\n      const selected = tab.classList.contains('on');\n      tab.setAttribute('aria-selected', String(selected));\n    });\n  };\n  new MutationObserver(syncPanelState).observe(body, {attributes:true, attributeFilter:['class']});\n  syncPanelState();\n  const composer = document.querySelector('.composer');\n  let maxHeight = innerHeight;\n  let frame = 0;\n  function refresh() {\n    frame = 0;\n    const visual = window.visualViewport;\n    const height = Math.round(visual ? visual.height : innerHeight);\n    const width = document.documentElement.clientWidth;\n    if (width > 600) { root.style.removeProperty('--phone-height'); body.classList.remove('phone-keyboard'); return; }\n    maxHeight = Math.max(maxHeight, height);\n    const isInput = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '');\n    const keyboard = isInput && maxHeight - height > 120;\n    body.classList.toggle('phone-keyboard', keyboard);\n    root.style.setProperty('--phone-height', `${height}px`);\n    for (const {card, width: originalWidth} of settingCards) {\n      card.style.setProperty('--phone-card-scale', String(Math.min(1, (width - 36) / originalWidth)));\n    }\n    const composerHeight = composer ? composer.getBoundingClientRect().height : 148;\n    // Fit collage both horizontally and vertically, without scaling text fields.\n    const scale = Math.max(.15, Math.min((width - 24) / 700, (height - 54 - composerHeight - 28) / 560, .8));\n    root.style.setProperty('--phone-collage-scale', String(scale));\n    body.style.setProperty('--cH', `${Math.ceil(composerHeight)}px`);\n  }\n  function schedule() { if (!frame) frame = requestAnimationFrame(refresh); }\n  addEventListener('resize', schedule);\n  window.visualViewport?.addEventListener('resize', schedule);\n  addEventListener('orientationchange', () => { maxHeight = 0; schedule(); });\n  document.addEventListener('focusin', schedule);\n  document.addEventListener('focusout', () => { schedule(); setTimeout(schedule, 250); });\n  if (composer) new ResizeObserver(schedule).observe(composer);\n  refresh();\n})();\n"
          html = html.replace('</head>', '<style id="phoneLayout">' + mobile_css + '</style></head>', 1)
          html = html.replace('</body>', '<script>' + mobile_js + '</script></body>', 1)
