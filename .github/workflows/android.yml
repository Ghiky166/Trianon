          from pathlib import Path
          from html.parser import HTMLParser
          import re, json, base64, hashlib, io
          from PIL import Image

          def restore09(assets, source, css, runtime):
              assets=Path(assets); raw=Path(source).read_text(encoding='utf-8')
              scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',raw,re.S|re.I)
              styles=re.findall(r'<style\b[^>]*>(.*?)</style>',raw,re.S|re.I)
              # Only extract approved markup and drawings. Never run the desktop/WebGL search module.
              class Parts(HTMLParser):
                  void=set('area base br col embed hr img input link meta param source track wbr'.split())
                  def __init__(self,text):
                      super().__init__(convert_charrefs=False)
                      self.text=text;self.nodes=[];self.stack=[];self.lines=[0]+[m.end() for m in re.finditer('\n',text)];self.feed(text)
                  def pos(self):
                      l,c=self.getpos();return self.lines[l-1]+c
                  def handle_starttag(self,t,a):
                      n={'tag':t,'attrs':dict(a),'start':self.pos(),'end':None,'parent':self.stack[-1] if self.stack else None};self.nodes.append(n)
                      if t in self.void:n['end']=self.pos()+len(self.get_starttag_text())
                      else:self.stack.append(n)
                  def handle_startendtag(self,t,a):
                      self.handle_starttag(t,a)
                      if self.stack and self.stack[-1]['start']==self.pos():self.stack.pop()['end']=self.pos()+len(self.get_starttag_text())
                  def handle_endtag(self,t):
                      for i in range(len(self.stack)-1,-1,-1):
                          if self.stack[i]['tag']==t:
                              end=self.text.find('>',self.pos())+1
                              for n in self.stack[i:]:n['end']=end
                              del self.stack[i:];break
                  def find(self,id=None,cls=None):
                      return next(n for n in self.nodes if (id is None or n['attrs'].get('id')==id) and (cls is None or cls in n['attrs'].get('class','').split()))
                  def part(self,n):return self.text[n['start']:n['end']]
              d=Parts(raw)
              flower=d.part(d.find(cls='dw-stk'));envelope=d.part(d.find(cls='pf-env'))
              grad=d.find(id='pg13')
              while grad['tag']!='svg':grad=grad['parent']
