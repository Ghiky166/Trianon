name: Build Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'dist/trianon.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preparation tools
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 PyYAML==6.0.2

      - name: Prepare 0.8 with original decorations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zlib, base64, urllib.request
          import yaml
          url = "https://raw.githubusercontent.com/Ghiky166/Trianon/843884b5db504712f051684acc7f5af6fd00fea8/.github/workflows/android.yml"
          with urllib.request.urlopen(url, timeout=45) as response:
              original = response.read()
          if hashlib.sha256(original).hexdigest() != "defae2b73799200ca2af8b3dca37421921dc33f9db641c716ce83e99dac1f9e3":
              raise SystemExit("Baseline workflow checksum mismatch")
          workflow = yaml.safe_load(original)
          step = next(s for s in workflow["jobs"]["build"]["steps"] if s.get("name") == "Prepare preview application")
          code = step["run"].split("python3 - <<'PY'\n", 1)[1].rsplit("\nPY", 1)[0]
          exec(compile(code, "verified-preview-builder", "exec"))
