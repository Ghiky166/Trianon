              definitions=s[s.index('const defs=document.createElementNS'):s.index('const root=document.createElement')]
              # The original full permission slip is embedded once, without the scripted turn engine.
              from html.parser import HTMLParser
              class Slice(HTMLParser):
                  def __init__(self):
                      super().__init__(convert_charrefs=False);self.begin=None;self.end=None;self.depth=0
                      self.lines=[0]+[m.end() for m in re.finditer('\n',raw)];self.feed(raw)
                  def position(self):
                      l,c=self.getpos();return self.lines[l-1]+c
                  def handle_starttag(self,t,a):
                      if t=='div':
                          if self.begin is not None and self.end is None:self.depth+=1
                          elif dict(a).get('id')=='slip':self.begin=self.position();self.depth=1
                  def handle_endtag(self,t):
                      if t=='div' and self.begin is not None and self.end is None:
                          self.depth-=1
                          if self.depth==0:self.end=raw.find('>',self.position())+1
              part=Slice();assert part.begin and part.end
              slip=raw[part.begin:part.end].replace('filter="url(#apRough)"','')
              exports='''
